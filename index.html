<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dieci secondi e muori!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Roboto Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    /* Background horror effect */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(20,0,0,0.6) 0%, rgba(0,0,0,0.95) 80%);
      z-index: 0;
      pointer-events: none;
    }

    .screen {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* Screen 1: Intro */
    h1.title {
      font-family: 'Nosifer', cursive;
      font-size: 2.2rem;
      color: #ff1111;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.7), 2px 2px 4px #000;
      margin-bottom: 30px;
      line-height: 1.3;
      letter-spacing: 2px;
      animation: pulseTitle 3s infinite alternate;
    }

    @keyframes pulseTitle {
      0% { text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
      100% { text-shadow: 0 0 25px rgba(255, 0, 0, 0.9), 0 0 5px #fff; }
    }

    .btn {
      background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
      color: #ffffff;
      border: 2px solid #ff3333;
      padding: 16px 36px;
      font-size: 1.4rem;
      font-family: 'Creepster', cursive;
      letter-spacing: 3px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
      transition: all 0.2s ease;
      outline: none;
      margin-top: 20px;
      text-transform: uppercase;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.8);
      background: linear-gradient(180deg, #660000 0%, #330000 100%);
    }

    /* Screen 2: Instructions */
    .instructions-box {
      background: rgba(15, 5, 5, 0.85);
      border: 1px solid #660000;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 25px;
    }

    .instructions-box p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #dddddd;
      margin: 0;
    }

    .highlight {
      color: #ff3333;
      font-weight: bold;
    }

    /* Screen 3: Game */
    .score-board {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .score-board span {
      color: #ff3333;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .skull-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #111;
      border: 3px solid #440000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
      transition: all 0.15s ease;
      margin: 20px 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .skull-btn svg {
      width: 100px;
      height: 100px;
      fill: #8b0000;
      filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.5));
      transition: all 0.2s ease;
    }

    .skull-btn.active {
      border-color: #ff0000;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
      animation: pulseSkull 1s infinite alternate;
    }

    .skull-btn.active svg {
      fill: #ff2222;
      filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.9));
    }

    @keyframes pulseSkull {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .result-display {
      min-height: 80px;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time-val {
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff;
    }

    .feedback-msg {
      font-size: 1.2rem;
      font-family: 'Creepster', cursive;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    .feedback-msg.success {
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    .feedback-msg.fail {
      color: #ff2222;
      text-shadow: 0 0 10px rgba(255, 34, 34, 0.5);
    }

    /* Screen 4: Win */
    .win-title {
      font-family: 'Nosifer', cursive;
      font-size: 2.2rem;
      color: #00ff66;
      text-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
      margin-bottom: 30px;
    }

    .secret-box {
      border: 2px dashed #ff2222;
      background: rgba(30, 0, 0, 0.9);
      padding: 25px;
      border-radius: 10px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
    }

    .secret-label {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .secret-text {
      font-family: 'Creepster', cursive;
      font-size: 2.5rem;
      color: #ffffff;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #ff0000;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: TITLE -->
  <div id="screen-title" class="screen active">
    <h1 class="title">DIECI SECONDI<br>E MUORI!</h1>
    <button class="btn" onclick="goToScreen('screen-instructions')">GIOCA</button>
  </div>

  <!-- SCHERMATA 2: INSTRUCTIONS -->
  <div id="screen-instructions" class="screen">
    <div class="instructions-box">
      <p>
        Conta esattamente <span class="highlight">10 secondi</span>, non un istante in più, non un istante in meno.
      </p>
      <br>
      <p>
        Fallo per <span class="highlight">5 volte</span> e avrai vinto!
      </p>
    </div>
    <button class="btn" onclick="goToScreen('screen-game')">AVANTI</button>
  </div>

  <!-- SCHERMATA 3: GAME -->
  <div id="screen-game" class="screen">
    <div class="score-board">
      PUNTI: <span id="score-display">0</span> / 5
    </div>

    <button id="skull-btn" class="skull-btn" onclick="toggleTimer()">
      <svg viewBox="0 0 24 24">
        <path d="M12,2C6.47,2 2,6.47 2,12C2,14.54 2.95,16.85 4.5,18.61L4.5,21C4.5,21.55 4.95,22 5.5,22L8.5,22C9.05,22 9.5,21.55 9.5,21L9.5,20L14.5,20L14.5,21C14.5,21.55 14.95,22 15.5,22L18.5,22C19.05,22 19.5,21.55 19.5,21L19.5,18.61C21.05,16.85 22,14.54 22,12C22,6.47 17.53,2 12,2ZM8.5,13C7.67,13 7,12.33 7,11.5C7,10.67 7.67,10 8.5,10C9.33,10 10,10.67 10,11.5C10,12.33 9.33,13 8.5,13ZM15.5,13C14.67,13 14,12.33 14,11.5C14,10.67 14.67,10 15.5,10C16.33,10 17,10.67 17,11.5C17,12.33 16.33,13 15.5,13Z"/>
      </svg>
    </button>

    <div class="result-display">
      <div id="time-val" class="time-val"></div>
      <div id="feedback-msg" class="feedback-msg"></div>
    </div>

    <button id="next-try-btn" class="btn" style="display: none;" onclick="resetRound()">CONTINUA</button>
  </div>

  <!-- SCHERMATA 4: WIN -->
  <div id="screen-win" class="screen">
    <h1 class="win-title">PROVA SUPERATA</h1>
    <div class="secret-box">
      <div class="secret-label">IL PROSSIMO INDIZIO È:</div>
      <div class="secret-text">DIETRO LO SPECCHIO</div>
    </div>
  </div>

  <script>
    // Audio Context Setup
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;

      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'success') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'fail') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // State Variables
    let currentScreen = 'screen-title';
    let score = 0;
    let startTime = 0;
    let isRunning = false;

    function goToScreen(screenId) {
      initAudio();
      playSound('click');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      currentScreen = screenId;
    }

    function toggleTimer() {
      initAudio();
      const skullBtn = document.getElementById('skull-btn');
      const timeVal = document.getElementById('time-val');
      const feedbackMsg = document.getElementById('feedback-msg');
      const nextBtn = document.getElementById('next-try-btn');

      if (!isRunning) {
        // START TIMER
        playSound('click');
        isRunning = true;
        startTime = performance.now();
        skullBtn.classList.add('active');
        timeVal.textContent = '';
        feedbackMsg.textContent = '';
        nextBtn.style.display = 'none';
      } else {
        // STOP TIMER
        const endTime = performance.now();
        isRunning = false;
        skullBtn.classList.remove('active');

        const elapsedSeconds = (endTime - startTime) / 1000;
        const formattedTime = elapsedSeconds.toFixed(2);
        
        timeVal.textContent = formattedTime + ' s';

        // Check precision: target 10s with tolerance of 0.25s (9.75s to 10.25s)
        const diff = Math.abs(elapsedSeconds - 10.0);

        if (diff <= 0.25) {
          score++;
          document.getElementById('score-display').textContent = score;
          feedbackMsg.textContent = 'PUNTO!';
          feedbackMsg.className = 'feedback-msg success';
          playSound('success');

          if (score >= 5) {
            setTimeout(() => {
              goToScreen('screen-win');
            }, 1200);
            return;
          }
        } else {
          feedbackMsg.textContent = 'FALLITO!';
          feedbackMsg.className = 'feedback-msg fail';
          playSound('fail');
        }

        nextBtn.style.display = 'inline-block';
      }
    }

    function resetRound() {
      playSound('click');
      document.getElementById('time-val').textContent = '';
      document.getElementById('feedback-msg').textContent = '';
      document.getElementById('next-try-btn').style.display = 'none';
    }
  </script>
</body>
</html>
